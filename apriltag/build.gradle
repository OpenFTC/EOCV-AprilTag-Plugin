apply plugin: 'com.android.library'
apply plugin: 'maven-publish'
apply plugin: 'signing'

ext{
    PUBLISH_VERSION = '2.2.0'
}

ext["signing.keyId"] = System.getenv('OPENFTC_GPG_KEY_ID')
ext["signing.password"] = System.getenv('OPENFTC_GPG_KEY_PASSWORD')
ext["signing.secretKeyRingFile"] = System.getenv('OPENFTC_GPG_KEY_FILE')

android {

    namespace "org.openftc.apriltag"

    compileSdk 23

    defaultConfig {
        minSdkVersion 23
        //noinspection ExpiredTargetSdkVersion
        targetSdkVersion 23
        versionCode 1
        versionName PUBLISH_VERSION
    }

    packagingOptions {
        exclude '/lib/armeabi-v7a/libOpenCvAndroid453.so'
        exclude '/lib/arm64-v8a/libOpenCvAndroid453.so'
    }

    android.buildFeatures.buildConfig true

    buildTypes {

        debug {
            ndk {
                abiFilters "armeabi-v7a", "arm64-v8a"
            }

            buildConfigField("String","_VERSION_NAME", "\"DEV BUILD\"")
        }

        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'

            ndk {
                abiFilters "armeabi-v7a", "arm64-v8a"
            }

            buildConfigField("String","_VERSION_NAME","\"" + PUBLISH_VERSION + "\"")
        }
    }

    publishing{
        singleVariant("release") {
            withSourcesJar()
            withJavadocJar()
        }
    }

    // Encapsulates your external native build configurations.
    externalNativeBuild {

        // Encapsulates your CMake build configurations.
        cmake {

            // Provides a relative path to your CMake build script.
            path "CMakeLists.txt"
        }
    }

    lintOptions {
        abortOnError false
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    ndkVersion '21.3.6528147'
}

dependencies {
    //compileOnly fileTree(include: ['*.aar'], dir: '../libs')
    compileOnly 'org.openftc:opencv-repackaged:4.5.3-B'
    compileOnly 'org.firstinspires.ftc:RobotCore:8.0.0'
    compileOnly 'com.android.support:support-annotations:28.0.0'
}

publishing {

    publications {
        release(MavenPublication) {
            groupId = 'org.openftc'
            artifactId = 'apriltag'
            version = PUBLISH_VERSION

            afterEvaluate {
                from components.release
            }

            // Self-explanatory metadata for the most part
            pom {
                name = "apriltag"
                description = "AprilTag library for FTC"
                url = "https://github.com/OpenFTC/EOCV-AprilTag-Plugin"
                licenses {
                    license {
                        name = 'MIT'
                        url = 'https://opensource.org/licenses/MIT'
                    }
                }
                developers {
                    developer {
                        id = 'openftc'
                        name = 'OpenFTC Team'
                        email = 'contact@openftc.org'
                        organization = 'OpenFTC'
                        organizationUrl = 'openftc.org'
                    }
                }
                // Version control info, if you're using GitHub, follow the format as seen here
                scm {
                    connection = "scm:git:github.com/OpenFTC/EOCV-AprilTag-Plugin.git"
                    url = "https://github.com/OpenFTC/EOCV-AprilTag-Plugin/tree/master"
                }
            }
        }
    }

    repositories {
        maven {
            name = 'myrepo'
            url = layout.buildDirectory.dir("repo")
        }
    }
}

signing {
    sign publishing.publications
}